name: Update works

on:
  schedule:
    - cron:  '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: 'stable'
    - name: checkout aozorabunko source
      run: git clone --depth 1 https://github.com/aozorabunko/aozorabunko.git
    - name: fetch metadata
      run: |
        curl -sSL -o list.zip https://www.aozora.gr.jp/index_pages/list_person_all_extended_utf8.zip
        unzip -o list.zip
    - name: build corpus
      run: go run ./cmd/aozora -src aozorabunko -meta list_person_all_extended_utf8.csv -dest .
    - name: commit & push
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add -A
        git commit -m "[ci skip] update corpus $(date '+%Y%m%d')" || echo "nothing to commit"
        git push origin HEAD:master
